# Builds the ready-to-run app on each system with tools/build_app.py and smoke-tests it.
# Pull requests that touch the app or the build, and manual runs, keep the builds as
# workflow artifacts. A release tag (vYYYY.MM.DD, pushed only after the user agrees)
# also makes a draft GitHub release with the three archives, for the user to publish.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'turbokit/**'
      - 'launch_turbokit.py'
      - 'requirements*.txt'
      - 'tools/build_app.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Tests
        run: python -B -m unittest discover -s tests
      - name: Build and smoke test
        shell: bash
        run: |
          version=dev
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; fi
          python -B tools/build_app.py --version "$version" --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: TurboKit-${{ runner.os }}
          path: releases/TurboKit-*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" releases/* --repo "${{ github.repository }}" --draft --title "TurboKit ${{ github.ref_name }}"
